      - name: Prepare FOSE plugin project
        shell: pwsh
        run: |
          $sample = Join-Path $env:GITHUB_WORKSPACE 'FOSE-Plugins\fose_plugins\ez_fose_plugin_example'
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'AutoDuplicateRepair.cpp') (Join-Path $sample 'main.cpp') -Force
          @'
          LIBRARY "AutoDuplicateRepair"
          EXPORTS
          FOSEPlugin_Query
          FOSEPlugin_Load
          '@ | Set-Content -Encoding ASCII (Join-Path $sample 'exports.def')

      - name: Build 32-bit Release DLL
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found on runner.' }
          $solution = Join-Path $env:GITHUB_WORKSPACE 'FOSE-Plugins\fose_plugins\ez_fose_plugin_example\ez_fose_plugin_example.sln'
          & $msbuild $solution /m /p:Configuration=Release /p:Platform=x86
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }

      - name: Assemble installable mod
        shell: pwsh
        run: |
          $dll = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'FOSE-Plugins') -Recurse -Filter 'ez_fose_plugin_example.dll' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw 'Compiled DLL not found.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifact\Data\FOSE\Plugins'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $dll.FullName (Join-Path $out 'AutoDuplicateRepair.dll') -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'AutoDuplicateRepair.ini') (Join-Path $out 'AutoDuplicateRepair.ini') -Force

      - name: Upload ready-to-install mod
        uses: actions/upload-artifact@v4
        with:
          name: AutoDuplicateRepair-FO3
          path: artifact/Data
          if-no-files-found: error
